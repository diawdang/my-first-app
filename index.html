<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกรายรับรายจ่าย</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#1b2130;--mute:#6a7388;--line:#e3e7ef;--inc:#15803d;--exp:#dc2626;--acc:#2f4fd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1e28;--text:#eef0f5;--mute:#9aa2b6;--line:#2a3042;--inc:#4ade80;--exp:#fb7185;--acc:#7b93ff;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:18px;line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.35rem;margin:4px 0 12px;text-align:center}
h2{font-size:1.05rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.monthbar button{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.4rem;cursor:pointer}
.monthbar .lbl{flex:1;text-align:center;font-weight:700;font-size:1.15rem}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.t{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.t small{color:var(--mute);font-size:.85rem;display:block}
.t b{font-size:1.5rem;display:block;word-break:break-all}
.t.full{grid-column:1/-1;text-align:center;border-width:2px}
.t.full b{font-size:1.9rem}
.inc{color:var(--inc)}.exp{color:var(--exp)}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:.95rem}
input{width:100%;height:56px;font:inherit;font-size:1.1rem;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:0 14px}
input:focus{outline:none;border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{height:60px;font:inherit;font-weight:700;font-size:1.15rem;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.seg button.on.e{background:var(--exp);border-color:var(--exp);color:#fff}
.seg button.on.i{background:var(--inc);border-color:var(--inc);color:#fff}
.save{width:100%;height:64px;margin-top:16px;font:inherit;font-weight:700;font-size:1.25rem;border:0;border-radius:16px;background:var(--acc);color:#fff;cursor:pointer}
.save:active{opacity:.85}
.err{color:var(--exp);font-size:.9rem;min-height:1.2em;margin-top:6px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font-family:inherit}
.legend{display:flex;gap:16px;justify-content:center;font-size:.9rem;margin-top:6px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .m{flex:1;min-width:0}
.row .m div{font-weight:600;overflow-wrap:anywhere}
.row small{color:var(--mute)}
.row b{white-space:nowrap}
.del{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font-size:1.1rem;cursor:pointer;flex:none}
.empty{text-align:center;color:var(--mute);padding:14px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>💰 บันทึกรายรับรายจ่าย</h1>

<div class="monthbar">
  <button id="prev" aria-label="เดือนก่อนหน้า">◀</button>
  <div class="lbl" id="mlabel"></div>
  <button id="next" aria-label="เดือนถัดไป">▶</button>
</div>

<div class="totals">
  <div class="t"><small>รายรับเดือนนี้</small><b class="inc" id="tInc">0</b></div>
  <div class="t"><small>รายจ่ายเดือนนี้</small><b class="exp" id="tExp">0</b></div>
  <div class="t full"><small>คงเหลือเดือนนี้</small><b id="tBal">0</b><small>ยอดสะสมทั้งหมด: <span id="tAll">0</span> บาท</small></div>
</div>

<div class="card">
  <h2>เพิ่มรายการ</h2>
  <label for="date">วันที่</label>
  <input type="date" id="date">
  <label for="name">รายการ</label>
  <input type="text" id="name" placeholder="เช่น ข้าวกลางวัน, เงินเดือน" maxlength="60" autocomplete="off">
  <label for="amt">จำนวนเงิน (บาท)</label>
  <input type="number" id="amt" placeholder="0" min="0" step="0.01" inputmode="decimal">
  <label>ประเภท</label>
  <div class="seg" id="seg">
    <button type="button" class="e on" data-t="expense">➖ รายจ่าย</button>
    <button type="button" class="i" data-t="income">➕ รายรับ</button>
  </div>
  <div class="err" id="err"></div>
  <button class="save" id="save" type="button">บันทึก</button>
</div>

<div class="card">
  <h2>กราฟสรุปรายเดือน (6 เดือนล่าสุด)</h2>
  <div id="chart"></div>
  <div class="legend"><span><i style="background:var(--inc)"></i>รายรับ</span><span><i style="background:var(--exp)"></i>รายจ่าย</span></div>
</div>

<div class="card">
  <h2>รายการของเดือนนี้</h2>
  <div id="list"></div>
</div>
</div>

<script>
const MN=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const KEY='income-expense-th-v1';
const $=id=>document.getElementById(id);
let items=[],type='expense';
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){items=[]}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmt=n=>n.toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ym=todayStr().slice(0,7);
$('date').value=todayStr();

function shift(k){let[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);ym=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);

$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;
  [...$('seg').children].forEach(x=>x.classList.toggle('on',x===b))};

$('save').onclick=()=>{
  const name=$('name').value.trim(),amt=parseFloat($('amt').value),date=$('date').value;
  if(!date){$('err').textContent='กรุณาเลือกวันที่';return}
  if(!name){$('err').textContent='กรุณาใส่ชื่อรายการ';$('name').focus();return}
  if(!(amt>0)){$('err').textContent='กรุณาใส่จำนวนเงินมากกว่า 0';$('amt').focus();return}
  $('err').textContent='';
  items.push({id:Date.now(),date,name,amt,type});persist();
  $('name').value='';$('amt').value='';ym=date.slice(0,7);render();
};

$('list').onclick=e=>{const b=e.target.closest('.del');if(!b)return;
  if(confirm('ลบรายการนี้ใช่ไหม?')){items=items.filter(i=>i.id!=b.dataset.id);persist();render()}};

const sumOf=(k,t)=>items.filter(i=>i.type===t&&i.date.slice(0,7)===k).reduce((s,i)=>s+i.amt,0);
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'ล.':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'พ.':String(Math.round(n));

function chart(){
  let[y,m]=ym.split('-').map(Number);const ks=[];
  for(let k=5;k>=0;k--){const d=new Date(y,m-1-k,1);ks.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  const inc=ks.map(k=>sumOf(k,'income')),exp=ks.map(k=>sumOf(k,'expense'));
  const max=Math.max(1,...inc,...exp),H=150,top=22,W=360,gw=W/6,bw=20;
  let s=`<svg viewBox="0 0 ${W} 200" role="img" aria-label="กราฟแท่งรายรับรายจ่ายรายเดือน">`;
  s+=`<line x1="0" x2="${W}" y1="${top+H}" y2="${top+H}" stroke="var(--line)" stroke-width="1.5"/>`;
  ks.forEach((k,i)=>{
    const cx=gw*i+gw/2;
    [[inc[i],cx-bw-1,'var(--inc)'],[exp[i],cx+1,'var(--exp)']].forEach(([v,x,c])=>{
      const h=v/max*H;
      s+=`<rect x="${x}" y="${top+H-h}" width="${bw}" height="${Math.max(h,v>0?2:0)}" rx="4" fill="${c}"/>`;
      if(v>0)s+=`<text x="${x+bw/2}" y="${top+H-h-4}" font-size="10" text-anchor="middle">${short(v)}</text>`;
    });
    const sel=k===ym;
    s+=`<text x="${cx}" y="${top+H+18}" font-size="12" text-anchor="middle" ${sel?'style="fill:var(--text);font-weight:700"':''}>${MS[+k.slice(5)-1]}</text>`;
  });
  $('chart').innerHTML=s+'</svg>';
}

function render(){
  const[y,m]=ym.split('-').map(Number);
  $('mlabel').textContent=MN[m-1]+' '+(y+543);
  const inc=sumOf(ym,'income'),exp=sumOf(ym,'expense'),bal=inc-exp;
  $('tInc').textContent='฿'+fmt(inc);$('tExp').textContent='฿'+fmt(exp);
  $('tBal').textContent='฿'+fmt(bal);$('tBal').className=bal>=0?'inc':'exp';
  const all=items.reduce((s,i)=>s+(i.type==='income'?i.amt:-i.amt),0);$('tAll').textContent=fmt(all);
  const cur=items.filter(i=>i.date.slice(0,7)===ym).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('list').innerHTML=cur.length?cur.map(i=>{const d=i.date.split('-');
    return `<div class="row"><div class="m"><div>${esc(i.name)}</div><small>${+d[2]} ${MS[+d[1]-1]} ${+d[0]+543}</small></div><b class="${i.type==='income'?'inc':'exp'}">${i.type==='income'?'+':'-'}${fmt(i.amt)}</b><button class="del" data-id="${i.id}" aria-label="ลบรายการ">🗑</button></div>`}).join(''):'<div class="empty">ยังไม่มีรายการในเดือนนี้</div>';
  chart();
}
render();
</script>
</body>
</html>
