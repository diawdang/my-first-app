<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดบันทึก</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px;
         max-width: 600px; margin-inline: auto; background: #f5f6f8; color: #222; }
  h1 { font-size: 1.3rem; }
  form, .item { background: #fff; padding: 12px; border-radius: 10px;
                margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  input, textarea, button { width: 100%; font-size: 16px; padding: 10px;
                            margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #1a73e8; color: #fff; border: 0; font-weight: 600; }
  button:disabled { opacity: .6; }
  .meta { font-size: .8rem; color: #777; }
  #status { min-height: 1.4em; font-size: .9rem; margin: 8px 0; }
</style>
</head>
<body>
<h1>สมุดบันทึก</h1>

<form id="f">
  <input id="name" placeholder="ชื่อ" required maxlength="100">
  <textarea id="note" rows="3" placeholder="บันทึก" maxlength="500"></textarea>
  <button id="btn" type="submit">บันทึก</button>
</form>
<div id="status"></div>
<div id="list"></div>

<script>
// ใส่ URL ที่ได้จากตอน Deploy (ลงท้ายด้วย /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbyNIDuMtyaroE54E8qKKcmEMkCWcB4m2xdG3UUQXt2WM8157TPfcmgvUoDMr37eWpsQ/exec';

const $ = id => document.getElementById(id);

function setStatus(msg, isError) {
  $('status').textContent = msg;
  $('status').style.color = isError ? '#c00' : '#080';
}

async function load() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    const list = $('list');
    list.innerHTML = '';
    data.rows.slice().reverse().forEach(r => {
      const div = document.createElement('div');
      div.className = 'item';
      const t = document.createElement('div');
      t.className = 'meta';
      t.textContent = new Date(r.timestamp).toLocaleString('th-TH') + ' · ' + r.name;
      const n = document.createElement('div');
      n.textContent = r.note;
      div.append(t, n);
      list.appendChild(div);
    });
  } catch (err) {
    setStatus('โหลดไม่สำเร็จ: ' + err.message, true);
  }
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('btn').disabled = true;
  setStatus('กำลังบันทึก...');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      // text/plain ทำให้ไม่เกิด preflight (CORS) ซึ่ง Apps Script ไม่รองรับ
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: $('name').value, note: $('note').value })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    $('note').value = '';
    setStatus('บันทึกแล้ว ✓');
    load();
  } catch (err) {
    setStatus('บันทึกไม่สำเร็จ: ' + err.message, true);
  } finally {
    $('btn').disabled = false;
  }
});

load();
</script>
</body>
</html>
